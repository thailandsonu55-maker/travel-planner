<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Travel & Leave Command Center (2026 - 2027)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
        .badge-gazetted { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-restricted { background-color: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">✈️</span>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Delhi Departure Command Center</h1>
                    <p class="text-xs text-slate-400">Multi-Trip Budgeting & Office Leave Engine (2026 - 2027)</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700 transition">📥 Export JSON</button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700 cursor-pointer transition">
                    📤 Import JSON
                    <input type="file" id="import-file" onchange="importJSON(event)" class="hidden" accept=".json">
                </label>
                <button onclick="createNewTripPrompt()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm">+ New Trip Plan</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Sidebar: Trips, Savings & Holiday Reference -->
        <div class="space-y-6">

            <!-- Trip Plans List -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-900">My Travel Plans</h2>
                    <span id="trip-count" class="text-xs font-medium bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">0 Plans</span>
                </div>
                <div id="trips-container" class="space-y-3">
                    <!-- Dynamic Trip Cards inserted here -->
                </div>
            </div>

            <!-- Savings Goal Calculator -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-base font-bold text-slate-900 mb-1">💰 Monthly Savings Goal Tracker</h2>
                <p class="text-xs text-slate-500 mb-4">Calculate how much to set aside each month for your trips.</p>
                
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Target Trip Budget (₹)</label>
                        <input type="number" id="savings-target" value="50000" oninput="updateSavingsCalc()" class="w-full border rounded p-2 text-slate-800 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Current Saved Pool (₹)</label>
                        <input type="number" id="savings-current" value="15000" oninput="updateSavingsCalc()" class="w-full border rounded p-2 text-slate-800 focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Target Departure Window</label>
                        <select id="savings-month" onchange="updateSavingsCalc()" class="w-full border rounded p-2 text-slate-800 focus:ring-1 focus:ring-blue-500">
                            <option value="2026-11">Nov 2026 (Thanksgiving)</option>
                            <option value="2026-12">Dec 2026</option>
                            <option value="2027-01">Jan 2027 (Republic Day)</option>
                            <option value="2027-03">Mar 2027 (Holi Weekend)</option>
                            <option value="2027-10">Oct 2027 (Diwali Window)</option>
                        </select>
                    </div>
                    <div class="p-3 bg-emerald-50 rounded-lg border border-emerald-200 mt-4">
                        <div class="text-xs text-emerald-800 font-medium">Required Monthly Savings:</div>
                        <div id="monthly-saving-result" class="text-xl font-extrabold text-emerald-700 mt-1">₹0 / mo</div>
                    </div>
                </div>
            </div>

            <!-- Indian Holiday Calendar Reference (2026 & 2027) -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-slate-900">🗓️ Indian Holidays</h2>
                    <div class="flex gap-1">
                        <button id="year-btn-2026" onclick="setHolidayYear(2026)" class="text-xs px-2.5 py-1 rounded bg-blue-600 text-white font-semibold">2026</button>
                        <button id="year-btn-2027" onclick="setHolidayYear(2027)" class="text-xs px-2.5 py-1 rounded bg-slate-100 text-slate-600 font-semibold">2027</button>
                    </div>
                </div>
                <div id="holiday-list-container" class="text-xs space-y-2 max-h-64 overflow-y-auto pr-1">
                    <!-- Holidays rendered dynamically -->
                </div>
            </div>

        </div>

        <!-- Main Workspace: Detailed Trip Configurator -->
        <div class="lg:col-span-2 space-y-6">
            <div id="active-trip-workspace" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <!-- Trip workspace rendered dynamically -->
            </div>
        </div>

    </main>

    <script>
        // 2026 & 2027 Indian Gazetted & Major Restricted Holidays Dataset
        const INDIAN_HOLIDAYS = [
            // 2026 Holidays
            { date: '2026-01-26', name: 'Republic Day', type: 'Gazetted' },
            { date: '2026-03-04', name: 'Holi', type: 'Gazetted' },
            { date: '2026-04-03', name: 'Good Friday', type: 'Gazetted' },
            { date: '2026-08-15', name: 'Independence Day', type: 'Gazetted' },
            { date: '2026-10-02', name: 'Gandhi Jayanti', type: 'Gazetted' },
            { date: '2026-10-20', name: 'Dussehra', type: 'Gazetted' },
            { date: '2026-11-08', name: 'Diwali', type: 'Gazetted' },
            { date: '2026-11-24', name: 'Guru Nanak Jayanti', type: 'Gazetted' },
            { date: '2026-11-26', name: 'US Thanksgiving (Reference)', type: 'Restricted' },
            { date: '2026-12-25', name: 'Christmas Day', type: 'Gazetted' },

            // 2027 Holidays
            { date: '2027-01-01', name: 'New Year\'s Day', type: 'Restricted' },
            { date: '2027-01-14', name: 'Makar Sankranti / Pongal', type: 'Restricted' },
            { date: '2027-01-26', name: 'Republic Day', type: 'Gazetted' },
            { date: '2027-03-10', name: 'Eid-ul-Fitr', type: 'Gazetted' },
            { date: '2027-03-23', name: 'Holi', type: 'Gazetted' },
            { date: '2027-03-26', name: 'Good Friday', type: 'Gazetted' },
            { date: '2027-04-15', name: 'Ram Navami', type: 'Gazetted' },
            { date: '2027-04-19', name: 'Mahavir Jayanti', type: 'Gazetted' },
            { date: '2027-05-17', name: 'Eid-ul-Adha (Bakrid)', type: 'Gazetted' },
            { date: '2027-05-20', name: 'Buddha Purnima', type: 'Gazetted' },
            { date: '2027-08-15', name: 'Independence Day', type: 'Gazetted' },
            { date: '2027-08-25', name: 'Janmashtami', type: 'Gazetted' },
            { date: '2027-10-02', name: 'Gandhi Jayanti', type: 'Gazetted' },
            { date: '2027-10-09', name: 'Dussehra (Vijayadashami)', type: 'Gazetted' },
            { date: '2027-10-29', name: 'Diwali (Deepavali)', type: 'Gazetted' },
            { date: '2027-11-14', name: 'Guru Nanak Jayanti', type: 'Gazetted' },
            { date: '2027-12-25', name: 'Christmas Day', type: 'Gazetted' }
        ];

        // Initial Sample State
        let appData = {
            activeHolidayYear: 2026,
            trips: [
                {
                    id: 'trip-2026-vietnam',
                    title: 'Vietnam (Hanoi & Ninh Binh)',
                    type: 'Couple - International',
                    startDate: '2026-11-21',
                    endDate: '2026-11-29',
                    budgetCap: 50000,
                    expenses: [
                        { id: 'e1', title: 'Roundtrip Flights DEL-HAN (VietJet)', category: 'Travel', source: 'Skyscanner', cost: 21000 },
                        { id: 'e2', title: 'Old Quarter Boutique Hotel (6N)', category: 'Stay', source: 'Agoda', cost: 9800 },
                        { id: 'e3', title: 'Ha Long Day Cruise & Transfers', category: 'Activities', source: 'Klook', cost: 6500 },
                        { id: 'e4', title: 'Vietnam Visas (2 PAX)', category: 'Misc', source: 'Gov Portal', cost: 4200 }
                    ]
                },
                {
                    id: 'trip-2027-holi',
                    title: 'Kerala Backwaters & Varkala Escape',
                    type: 'Couple - Domestic',
                    startDate: '2027-03-20',
                    endDate: '2027-03-28',
                    budgetCap: 50000,
                    expenses: [
                        { id: 'e20', title: 'Flights DEL-TRV Roundtrip', category: 'Travel', source: 'MakeMyTrip', cost: 16500 },
                        { id: 'e21', title: 'Cliff Resort Varkala & Homestay', category: 'Stay', source: 'Booking.com', cost: 14000 },
                        { id: 'e22', title: 'Food & Scooter Rentals', category: 'Activities', source: 'Local', cost: 9000 }
                    ]
                }
            ],
            activeTripId: 'trip-2026-vietnam'
        };

        function init() {
            loadFromLocalStorage();
            renderTripsList();
            renderActiveWorkspace();
            renderHolidayCalendar();
            updateSavingsCalc();
        }

        function setHolidayYear(year) {
            appData.activeHolidayYear = year;
            document.getElementById('year-btn-2026').className = year === 2026 ? "text-xs px-2.5 py-1 rounded bg-blue-600 text-white font-semibold" : "text-xs px-2.5 py-1 rounded bg-slate-100 text-slate-600 font-semibold";
            document.getElementById('year-btn-2027').className = year === 2027 ? "text-xs px-2.5 py-1 rounded bg-blue-600 text-white font-semibold" : "text-xs px-2.5 py-1 rounded bg-slate-100 text-slate-600 font-semibold";
            renderHolidayCalendar();
        }

        function renderHolidayCalendar() {
            const container = document.getElementById('holiday-list-container');
            const filtered = INDIAN_HOLIDAYS.filter(h => h.date.startsWith(appData.activeHolidayYear.toString()));
            
            container.innerHTML = filtered.map(h => {
                const dateObj = new Date(h.date);
                const dayName = dateObj.toLocaleDateString('en-IN', { weekday: 'short' });
                const isGazetted = h.type === 'Gazetted';
                return `
                    <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
                        <div>
                            <div class="font-medium text-slate-800">${h.name}</div>
                            <div class="text-[10px] text-slate-500">${h.date} (${dayName})</div>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded-full ${isGazetted ? 'badge-gazetted' : 'badge-restricted'}">${h.type}</span>
                    </div>
                `;
            }).join('');
        }

        function renderTripsList() {
            const container = document.getElementById('trips-container');
            document.getElementById('trip-count').innerText = `${appData.trips.length} Plans`;
            container.innerHTML = '';

            appData.trips.forEach(trip => {
                const totalCost = trip.expenses.reduce((sum, e) => sum + e.cost, 0);
                const isOver = totalCost > trip.budgetCap;
                const isActive = trip.id === appData.activeTripId;

                container.innerHTML += `
                    <div onclick="setActiveTrip('${trip.id}')" class="p-3.5 rounded-xl border cursor-pointer transition ${isActive ? 'border-blue-600 bg-blue-50/50 shadow-sm' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-slate-900 text-xs">${trip.title}</h3>
                            <span class="text-[10px] px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">${trip.type}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 mb-2">📅 ${trip.startDate} to ${trip.endDate}</div>
                        <div class="flex justify-between items-center text-xs font-semibold">
                            <span>₹${totalCost.toLocaleString('en-IN')}</span>
                            <span class="${isOver ? 'text-red-600' : 'text-emerald-600'}">${isOver ? 'Over Budget' : 'Within ₹50k'}</span>
                        </div>
                    </div>
                `;
            });
        }

        function setActiveTrip(id) {
            appData.activeTripId = id;
            saveToLocalStorage();
            renderTripsList();
            renderActiveWorkspace();
        }

        function calculatePaidLeaves(startStr, endStr) {
            if (!startStr || !endStr) return 0;
            let current = new Date(startStr);
            const end = new Date(endStr);
            let leaveCount = 0;

            const gazettedDates = INDIAN_HOLIDAYS.filter(h => h.type === 'Gazetted').map(h => h.date);

            while (current <= end) {
                const dayOfWeek = current.getDay();
                const dateString = current.toISOString().split('T')[0];
                
                // Exclude weekends (Sun=0, Sat=6) and Gazetted Holidays
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !gazettedDates.includes(dateString)) {
                    leaveCount++;
                }
                current.setDate(current.getDate() + 1);
            }
            return leaveCount;
        }

        function renderActiveWorkspace() {
            const workspace = document.getElementById('active-trip-workspace');
            const trip = appData.trips.find(t => t.id === appData.activeTripId);

            if (!trip) {
                workspace.innerHTML = `<div class="text-center py-12 text-slate-400">Select or create a trip to start planning.</div>`;
                return;
            }

            const totalCost = trip.expenses.reduce((sum, e) => sum + e.cost, 0);
            const paidLeaves = calculatePaidLeaves(trip.startDate, trip.endDate);
            const remainingMargin = trip.budgetCap - totalCost;

            workspace.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 pb-6 border-b">
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="text-xl font-bold text-slate-900">${trip.title}</h2>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Ex-New Delhi Departure Hub</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="deleteCurrentTrip()" class="text-xs text-red-600 hover:text-red-700 font-medium px-3 py-1.5 rounded border border-red-200 hover:bg-red-50">Delete Trip</button>
                    </div>
                </div>

                <!-- Inputs Bar -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 my-5">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Start Date</label>
                        <input type="date" value="${trip.startDate}" onchange="updateTripMeta('startDate', this.value)" class="w-full border rounded p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">End Date</label>
                        <input type="date" value="${trip.endDate}" onchange="updateTripMeta('endDate', this.value)" class="w-full border rounded p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Trip Type</label>
                        <select onchange="updateTripMeta('type', this.value)" class="w-full border rounded p-2 text-xs">
                            <option value="Solo - Domestic" ${trip.type === 'Solo - Domestic' ? 'selected' : ''}>Solo - Domestic</option>
                            <option value="Couple - Domestic" ${trip.type === 'Couple - Domestic' ? 'selected' : ''}>Couple - Domestic</option>
                            <option value="Couple - International" ${trip.type === 'Couple - International' ? 'selected' : ''}>Couple - International</option>
                        </select>
                    </div>
                </div>

                <!-- Key Metrics Cards -->
                <div class="grid grid-cols-3 gap-4 my-6">
                    <div class="p-3 bg-slate-50 rounded-xl border text-center">
                        <div class="text-[11px] text-slate-500">Estimated Total Cost</div>
                        <div class="text-lg font-extrabold text-slate-900 mt-0.5">₹${totalCost.toLocaleString('en-IN')}</div>
                    </div>
                    <div class="p-3 bg-slate-50 rounded-xl border text-center">
                        <div class="text-[11px] text-slate-500">Remaining Budget</div>
                        <div class="text-lg font-extrabold ${remainingMargin < 0 ? 'text-red-600' : 'text-emerald-600'} mt-0.5">₹${remainingMargin.toLocaleString('en-IN')}</div>
                    </div>
                    <div class="p-3 bg-blue-50 rounded-xl border border-blue-200 text-center">
                        <div class="text-[11px] text-blue-700 font-semibold">Office Leaves Needed</div>
                        <div class="text-lg font-extrabold text-blue-900 mt-0.5">${paidLeaves} Days</div>
                    </div>
                </div>

                <!-- Expenses Table -->
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-900 text-sm">Line Items & Quotes Comparison</h3>
                        <button onclick="addExpensePrompt()" class="text-xs bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg transition">+ Add Expense</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-slate-100 border-b text-slate-600">
                                    <th class="p-2.5">Item Name</th>
                                    <th class="p-2.5">Category</th>
                                    <th class="p-2.5">Source / Platform</th>
                                    <th class="p-2.5 text-right">Cost (₹)</th>
                                    <th class="p-2.5 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${trip.expenses.map((exp, idx) => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-2.5 font-medium text-slate-800">${exp.title}</td>
                                        <td class="p-2.5 text-slate-500">${exp.category}</td>
                                        <td class="p-2.5 text-blue-600 font-medium">${exp.source}</td>
                                        <td class="p-2.5 text-right font-bold text-slate-900">₹${exp.cost.toLocaleString('en-IN')}</td>
                                        <td class="p-2.5 text-center">
                                            <button onclick="deleteExpense(${idx})" class="text-red-500 hover:text-red-700">✕</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function createNewTripPrompt() {
            const title = prompt("Enter Trip Destination/Title:", "Thailand Coastal Escape");
            if (!title) return;
            const type = prompt("Type (Solo - Domestic / Couple - Domestic / Couple - International):", "Couple - International");
            
            const newTrip = {
                id: 'trip-' + Date.now(),
                title: title,
                type: type || 'Couple - International',
                startDate: '2027-01-22',
                endDate: '2027-01-27',
                budgetCap: 50000,
                expenses: []
            };

            appData.trips.push(newTrip);
            setActiveTrip(newTrip.id);
        }

        function updateTripMeta(key, value) {
            const trip = appData.trips.find(t => t.id === appData.activeTripId);
            if (trip) {
                trip[key] = value;
                saveToLocalStorage();
                renderTripsList();
                renderActiveWorkspace();
            }
        }

        function addExpensePrompt() {
            const trip = appData.trips.find(t => t.id === appData.activeTripId);
            if (!trip) return;

            const title = prompt("Expense Title (e.g. VietJet Flight DEL-HAN):");
            if (!title) return;
            const source = prompt("Source / Platform (e.g. Skyscanner, Agoda, Klook):", "Skyscanner");
            const cost = parseFloat(prompt("Estimated Cost (in INR):", "15000"));

            if (!isNaN(cost)) {
                trip.expenses.push({
                    id: 'e-' + Date.now(),
                    title,
                    category: 'General',
                    source: source || 'Direct',
                    cost
                });
                saveToLocalStorage();
                renderTripsList();
                renderActiveWorkspace();
            }
        }

        function deleteExpense(index) {
            const trip = appData.trips.find(t => t.id === appData.activeTripId);
            if (trip) {
                trip.expenses.splice(index, 1);
                saveToLocalStorage();
                renderTripsList();
                renderActiveWorkspace();
            }
        }

        function deleteCurrentTrip() {
            if (confirm("Are you sure you want to delete this trip plan?")) {
                appData.trips = appData.trips.filter(t => t.id !== appData.activeTripId);
                appData.activeTripId = appData.trips[0] ? appData.trips[0].id : null;
                saveToLocalStorage();
                init();
            }
        }

        function updateSavingsCalc() {
            const target = parseFloat(document.getElementById('savings-target').value) || 50000;
            const current = parseFloat(document.getElementById('savings-current').value) || 0;
            const targetMonthStr = document.getElementById('savings-month').value;
            
            const [targetYear, targetMonth] = targetMonthStr.split('-').map(Number);
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            const totalMonths = ((targetYear - currentYear) * 12) + (targetMonth - currentMonth);
            const monthsLeft = Math.max(1, totalMonths);

            const remaining = Math.max(0, target - current);
            const monthlyNeed = Math.ceil(remaining / monthsLeft);

            document.getElementById('monthly-saving-result').innerText = `₹${monthlyNeed.toLocaleString('en-IN')} / mo`;
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('delhi_travel_app_data', JSON.stringify(appData));
            } catch (e) {
                console.warn('Storage blocked');
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('delhi_travel_app_data');
                if (saved) {
                    appData = JSON.parse(saved);
                }
            } catch (e) {
                console.warn('Storage error');
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "delhi_travel_plans_2026_2027.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    saveToLocalStorage();
                    init();
                    alert("Travel plans imported successfully!");
                } catch (err) {
                    alert("Invalid JSON file.");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
